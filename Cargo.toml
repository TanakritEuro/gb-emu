[workspace]
resolver = "2"
members = ["crates/gb-core", "crates/gb-cli", "crates/gb-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Some tests play whole games (two linked Game Boys play Link Pong to the
# end): optimize test builds, or those take half a minute.
[profile.test]
opt-level = 2
